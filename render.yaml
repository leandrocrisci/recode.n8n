# Referência das variáveis do n8n no Render.
# Se não puder usar Blueprint, crie o Web Service manualmente (Docker, a partir deste repositório)
# e cadastre as mesmas variáveis na aba Environment.
services:
  - type: web
    name: n8n-service
    plan: free            # o plano gratuito dorme após ~15 min sem uso; para webhooks use um plano pago
    runtime: image
    image:
      url: docker.io/n8nio/n8n:2.43.8   # versão fixada
    healthCheckPath: /healthz
    envVars:
      # Gera a chave que criptografa as credenciais. Nunca altere depois de criada,
      # senão as credenciais salvas (como a do Gemini) deixam de funcionar.
      - key: N8N_ENCRYPTION_KEY
        generateValue: true

      # Porta, protocolo e proxy do Render
      - key: N8N_PORT
        value: "10000"
      - key: N8N_PROTOCOL
        value: https
      - key: N8N_PROXY_HOPS
        value: "1"

      # Preencha no painel depois do primeiro deploy, com o domínio do serviço
      # Ex.: N8N_HOST = n8n-service.onrender.com
      #      WEBHOOK_URL = https://n8n-service.onrender.com/
      - key: N8N_HOST
        sync: false
      - key: WEBHOOK_URL
        sync: false
      - key: N8N_EDITOR_BASE_URL
        sync: false

      - key: GENERIC_TIMEZONE
        value: America/Sao_Paulo
      - key: TZ
        value: America/Sao_Paulo

      # Limpa o histórico antigo de execuções (7 dias) para economizar espaço no banco
      - key: EXECUTIONS_DATA_PRUNE
        value: "true"
      - key: EXECUTIONS_DATA_MAX_AGE
        value: "168"

      # Banco Postgres (preenchido automaticamente a partir do banco abaixo)
      - key: DB_TYPE
        value: postgresdb
      - key: DB_POSTGRESDB_DATABASE
        fromDatabase:
          name: n8n-db
          property: database
      - key: DB_POSTGRESDB_HOST
        fromDatabase:
          name: n8n-db
          property: host
      - key: DB_POSTGRESDB_PORT
        fromDatabase:
          name: n8n-db
          property: port
      - key: DB_POSTGRESDB_PASSWORD
        fromDatabase:
          name: n8n-db
          property: password
      - key: DB_POSTGRESDB_USER
        fromDatabase:
          name: n8n-db
          property: user

databases:
  - name: n8n-db
    plan: free            # confira no Render os limites atuais do plano gratuito do Postgres
